<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IES · Procesos Contables</title>

  <!-- Firebase SDK v10 compat -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

<style>
/* ─── TOKENS ──────────────────────────────────────────────────── */
:root{
  --bg:#EEF2F7;--surface:#FFFFFF;--sur2:#F5F7FA;
  --ink:#1A2540;--ink2:#374151;--mu:#64748B;--mu2:#94A3B8;
  --bd:#CBD5E1;--bd2:#94A3B8;
  --primary:#1B3A6B;--primary-mid:#2D5AA0;--primary-lt:#ECF2FA;
  --sa:#1D4ED8;--sa-bg:#EFF6FF;--sa-bd:#BFDBFE;
  --sd:#15803D;--sd-bg:#F0FDF4;--sd-bd:#BBF7D0;
  --so:#DC2626;--so-bg:#FEF2F2;--so-bd:#FECACA;
  --su:#B45309;--su-bg:#FFFBEB;--su-bd:#FDE68A;
  --sf:#64748B;--sf-bg:#F8FAFC;--sf-bd:#E2E8F0;
  --r:8px;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);
     line-height:1.5;min-height:100dvh;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
input[type=checkbox]{accent-color:var(--sd)}
:focus-visible{outline:2px solid var(--primary-mid);outline-offset:2px}
#app{max-width:480px;margin:0 auto}

/* ─── IES IDENTIDAD ──────────────────────────────────────────── */
.ies-mark{display:flex;align-items:center;gap:10px}
.ies-badge{width:36px;height:36px;border-radius:8px;background:var(--primary);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:900;color:#fff;letter-spacing:-.3px;flex-shrink:0;}
.ies-wm{flex:1;min-width:0}
.ies-name{font-size:13px;font-weight:700;color:var(--primary);letter-spacing:-.2px;line-height:1.2}
.ies-sub{font-size:9px;color:var(--mu);letter-spacing:.6px;text-transform:uppercase;font-weight:600;margin-top:1px}

/* ─── LOADING ────────────────────────────────────────────────── */
.load-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100dvh;gap:16px;padding:24px;}
.spin{width:36px;height:36px;border:3px solid var(--bd);border-top-color:var(--primary);
  border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-size:13px;color:var(--mu);font-weight:500}

/* ─── LOGIN ──────────────────────────────────────────────────── */
.log-wrap{min-height:100dvh;display:flex;flex-direction:column;padding:0}
.log-top{background:var(--primary);padding:48px 32px 32px;text-align:center}
.log-ies{font-size:48px;font-weight:900;color:#fff;letter-spacing:-2px;line-height:1}
.log-title{font-size:18px;font-weight:700;color:rgba(255,255,255,.85);margin-top:8px}
.log-sub{font-size:12px;color:rgba(255,255,255,.5);margin-top:4px}
.log-body{flex:1;padding:32px 24px 24px;background:var(--bg)}
.log-card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);
  padding:24px;display:flex;flex-direction:column;gap:16px;}
.log-field{display:flex;flex-direction:column;gap:6px}
.log-label{font-size:12px;font-weight:600;color:var(--ink2)}
.log-input{width:100%;padding:10px 13px;border:1px solid var(--bd);border-radius:6px;
  font-size:14px;color:var(--ink);background:var(--surface);
  transition:border-color .12s,box-shadow .12s;outline:none;}
.log-input:focus{border-color:var(--primary-mid);box-shadow:0 0 0 3px var(--primary-lt)}
.log-btn{width:100%;padding:12px;border-radius:var(--r);
  background:var(--primary);color:#fff;font-size:14px;font-weight:700;
  transition:background .12s;margin-top:4px;}
.log-btn:hover{background:var(--primary-mid)}
.log-btn:disabled{opacity:.5;cursor:not-allowed}
.log-err{font-size:12px;color:var(--so);background:var(--so-bg);
  border:1px solid var(--so-bd);border-radius:6px;padding:9px 12px;text-align:center}
.log-foot{font-size:11px;color:var(--mu);text-align:center;padding:16px;line-height:1.6}

/* ─── HEADER COMPARTIDO ──────────────────────────────────────── */
.app-hdr{
  position:sticky;top:0;z-index:30;
  background:var(--primary);
  display:flex;align-items:center;gap:10px;padding:10px 14px;
}
.app-hdr-title{flex:1;min-width:0}
.app-hdr-t{font-weight:700;font-size:14px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-hdr-s{font-size:10px;color:rgba(255,255,255,.5);margin-top:1px}
.hdr-icon-btn{
  width:32px;height:32px;border-radius:6px;
  background:rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:#fff;flex-shrink:0;
  transition:background .1s;
}
.hdr-icon-btn:hover{background:rgba(255,255,255,.22)}
.hdr-pill{font-size:9px;font-weight:800;color:rgba(255,255,255,.55);
  padding:3px 8px;border-radius:4px;background:rgba(255,255,255,.1);
  letter-spacing:.6px;flex-shrink:0;}

/* ─── LANDING ────────────────────────────────────────────────── */
.l-banner{background:var(--surface);border-bottom:1px solid var(--bd);padding:14px 16px}
.l-welcome{font-size:11px;color:var(--mu);font-weight:600;
  letter-spacing:.4px;text-transform:uppercase;margin-bottom:2px}
.l-tagline{font-size:21px;font-weight:800;letter-spacing:-.5px;
  color:var(--ink);line-height:1.2;padding:16px 16px 10px}
.l-tagline em{font-style:normal;color:var(--primary)}
.l-sec{padding:4px 16px 8px;font-size:10px;letter-spacing:1.8px;
  text-transform:uppercase;color:var(--mu);font-weight:700}
.l-list{display:flex;flex-direction:column;gap:5px;padding:0 12px 4px}
.p-card{display:flex;align-items:center;gap:12px;padding:12px 13px;
  background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);
  text-align:left;color:var(--ink);width:100%;
  transition:box-shadow .12s,border-color .12s;}
.p-card:hover{box-shadow:0 2px 14px rgba(26,58,107,.1);border-color:var(--primary-mid)}
.p-av{width:42px;height:42px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff;}
.p-info{flex:1;min-width:0}
.p-name{font-weight:600;font-size:14px;line-height:1.2}
.p-role{font-size:11px;color:var(--mu);margin-top:2px}
.p-chip{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;
  flex-shrink:0;white-space:nowrap;border:1px solid transparent;}
.p-arr{color:var(--bd2);font-size:16px;flex-shrink:0}
.l-bottom{padding:8px 12px 24px;display:flex;flex-direction:column;gap:6px}
.ghost-btn{display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:11px;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--bd);
  font-size:13px;font-weight:500;color:var(--ink2);
  transition:background .1s,border-color .1s;}
.ghost-btn:hover{background:var(--primary-lt);border-color:var(--primary-mid);color:var(--primary)}
.l-note{font-size:11px;color:var(--mu);text-align:center;line-height:1.7}

/* ─── DASHBOARD ──────────────────────────────────────────────── */
.d-back{background:rgba(255,255,255,.15);border-radius:6px;color:#fff;
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;line-height:1;transition:background .1s;}
.d-back:hover{background:rgba(255,255,255,.25)}
.d-av{width:36px;height:36px;border-radius:7px;flex-shrink:0;
  background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:#fff;}
.sum-wrap{padding:12px 12px 0}
.sum-card{background:var(--surface);border:1px solid var(--bd);
  border-radius:var(--r);padding:16px;}
.sum-row{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px}
.sum-left{flex:1}
.sum-eyebrow{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--mu);font-weight:700;margin-bottom:6px}
.sum-frac{display:flex;align-items:baseline;gap:4px;line-height:1;font-variant-numeric:tabular-nums}
.sum-frac-n{font-size:34px;font-weight:800;letter-spacing:-1.5px}
.sum-frac-d{font-size:17px;font-weight:400;color:var(--mu);letter-spacing:-.3px}
.sum-frac-lbl{font-size:11px;color:var(--mu);margin-top:5px;font-weight:500}
.sum-right{background:var(--bg);border-radius:6px;padding:10px 14px;
  text-align:right;border:1px solid var(--bd);}
.sum-dn{font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.sum-dl{font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;
  margin-top:3px;font-weight:700;line-height:1.4}
.pbar-bg{height:3px;background:var(--bd);border-radius:2px;overflow:hidden}
.pbar-fill{height:100%;border-radius:2px;transition:width .5s ease}
.pbar-meta{display:flex;justify-content:space-between;font-size:10px;
  color:var(--mu);margin-top:4px;font-variant-numeric:tabular-nums;font-weight:500}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.chip-s{display:flex;align-items:center;gap:4px;font-size:10px;
  font-weight:700;padding:3px 9px;border-radius:20px;}
.chip-dot{width:4px;height:4px;border-radius:50%;background:currentColor;flex-shrink:0}
.tg-wrap{padding:10px 12px 0}
.tg-hdr{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.tg-ico{width:20px;height:20px;border-radius:5px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;}
.tg-lbl{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700}
.tg-cnt{margin-left:auto;font-size:10px;color:var(--mu);font-variant-numeric:tabular-nums;font-weight:600}
.t-card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);
  margin-bottom:6px;overflow:hidden;}
.t-card.st-active {border-left:3px solid var(--sa)}
.t-card.st-overdue{border-left:3px solid var(--so)}
.t-card.st-upcoming{border-left:3px solid var(--su)}
.t-card.st-done   {background:var(--sur2)}
.t-card.st-done .t-name{text-decoration:line-through;color:var(--mu)}
.t-card.st-future {opacity:.8}
.t-main{display:flex;align-items:flex-start;gap:10px;padding:11px 10px 11px 13px}
.t-cb{width:15px;height:15px;flex-shrink:0;margin-top:2px;cursor:pointer}
.t-cb:disabled{cursor:default;opacity:.5}
.t-body{flex:1;min-width:0}
.t-name{font-size:13px;font-weight:500;line-height:1.35;color:var(--ink)}
.t-meta{display:flex;align-items:center;gap:5px;margin-top:5px;flex-wrap:wrap}
.t-days{font-size:10px;font-weight:700;color:var(--mu);font-variant-numeric:tabular-nums}
.t-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px}
.t-doc{font-size:9px;font-weight:800;padding:2px 6px;border-radius:3px;
  background:var(--bg);color:var(--mu);letter-spacing:.5px;border:1px solid var(--bd);}
.t-exp{color:var(--mu2);font-size:11px;padding:10px 10px 10px 6px;
  align-self:flex-start;flex-shrink:0;transition:color .1s;}
.t-exp:hover{color:var(--ink)}
.t-det{display:none;padding:0 13px 12px 38px;font-size:12px;
  color:var(--mu);line-height:1.7;border-top:1px solid var(--bd);}
.t-det.open{display:block;padding-top:10px}
.revert-row{padding:8px 13px 10px 38px;border-top:1px solid var(--bd)}
.revert-btn{display:inline-flex;align-items:center;gap:5px;font-size:11px;
  font-weight:600;color:var(--mu);padding:5px 12px;border-radius:5px;
  border:1px solid var(--bd);background:var(--surface);
  transition:color .12s,border-color .12s,background .12s;}
.revert-btn:hover{color:var(--so);border-color:var(--so-bd);background:var(--so-bg)}
.d-foot{padding:12px 12px 28px}
.export-btn{width:100%;padding:11px;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--bd);
  font-size:12px;color:var(--mu);font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:background .1s,border-color .1s,color .1s;}
.export-btn:hover{background:var(--primary-lt);border-color:var(--primary-mid);color:var(--primary)}

/* ─── EQUIPO ─────────────────────────────────────────────────── */
.tm-body{padding:10px 12px 0}
.tm-card{background:var(--surface);border:1px solid var(--bd);
  border-radius:var(--r);margin-bottom:8px;overflow:hidden;}
.tm-ch{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--bd)}
.tm-tasks{padding:8px 13px}
.tm-row{display:flex;align-items:flex-start;gap:7px;padding:3px 0;
  font-size:12px;line-height:1.35;}
.tm-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:4px}
.tm-tn{flex:1;color:var(--ink2)}
.tm-td{font-size:10px;color:var(--mu);flex-shrink:0;
  font-variant-numeric:tabular-nums;font-weight:600}
.tm-done-row .tm-tn{text-decoration:line-through;color:var(--mu)}
.tm-empty{font-size:12px;color:var(--mu);padding:2px 0;font-style:italic}
.tm-foot{padding:12px 12px 28px}

/* ─── CALENDARIO ─────────────────────────────────────────────── */
.cal-dnames{display:grid;grid-template-columns:repeat(7,1fr);
  background:var(--primary);padding:4px 10px 8px;}
.cal-dn{text-align:center;font-size:9px;font-weight:700;
  color:rgba(255,255,255,.45);letter-spacing:.6px;text-transform:uppercase;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:8px 10px 4px}
.cal-cell{background:var(--surface);border-radius:6px;padding:5px 3px 6px;
  min-height:56px;border:1px solid var(--bd);cursor:pointer;
  transition:border-color .12s,box-shadow .12s;
  display:flex;flex-direction:column;align-items:center;}
.cal-cell:hover{border-color:var(--primary-mid)}
.cal-cell.other-month{background:transparent;border-color:transparent;
  cursor:default;pointer-events:none;}
.cal-cell.today{border-color:var(--primary-mid);box-shadow:0 0 0 2px var(--primary-lt)}
.cal-cell.selected{border-color:var(--primary);background:var(--primary-lt)}
.cal-num{font-size:11px;font-weight:500;color:var(--ink2);line-height:1;
  margin-bottom:5px;width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;border-radius:50%;}
.cal-num.today-n{background:var(--primary);color:#fff;font-weight:700}
.cal-num.sel-n{color:var(--primary);font-weight:700}
.cal-dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:34px}
.cal-dot{width:6px;height:6px;border-radius:2px;flex-shrink:0}
.cal-panel{padding:0 10px 4px}
.cal-panel-card{background:var(--surface);border:1px solid var(--bd);
  border-radius:var(--r);overflow:hidden;}
.cal-panel-hdr{padding:10px 13px;border-bottom:1px solid var(--bd);
  font-size:12px;font-weight:700;color:var(--primary);
  display:flex;align-items:center;justify-content:space-between;}
.cal-panel-count{font-size:10px;font-weight:600;color:var(--mu);
  background:var(--bg);border:1px solid var(--bd);padding:2px 8px;border-radius:20px;}
.cal-trow{display:flex;align-items:flex-start;gap:8px;padding:9px 13px}
.cal-trow+.cal-trow{border-top:1px solid var(--bd)}
.cal-tav{width:22px;height:22px;border-radius:5px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:800;color:#fff;margin-top:1px;}
.cal-tinfo{flex:1;min-width:0}
.cal-tname{font-size:12px;color:var(--ink2);line-height:1.35}
.cal-tname.done{text-decoration:line-through;color:var(--mu)}
.cal-tperson{font-size:10px;color:var(--mu);margin-top:2px}
.cal-tdoc{font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;
  background:var(--bg);color:var(--mu);border:1px solid var(--bd);
  flex-shrink:0;align-self:flex-start;margin-top:2px;letter-spacing:.4px;}
.cal-empty{padding:14px 13px;font-size:12px;color:var(--mu);font-style:italic}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px 10px}
.cal-leg-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--mu);font-weight:500}
.cal-leg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:0 10px 6px}
.cal-nav-btn{width:32px;height:32px;border-radius:6px;background:var(--surface);
  border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--ink2);transition:background .1s,border-color .1s;}
.cal-nav-btn:hover{background:var(--primary-lt);border-color:var(--primary-mid);color:var(--primary)}
.cal-nav-label{font-size:14px;font-weight:700;color:var(--ink)}
.cal-yr-btn{font-size:11px;font-weight:600;color:var(--primary-mid);
  padding:4px 10px;border-radius:5px;border:1px solid var(--primary-lt);
  background:var(--primary-lt);transition:background .1s,border-color .1s;}
.cal-yr-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.cal-foot{padding:12px 10px 28px}

/* ─── AÑO ────────────────────────────────────────────────────── */
.yr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 10px 4px}
.yr-card{background:var(--surface);border:1px solid var(--bd);
  border-radius:var(--r);padding:9px 9px 8px;cursor:pointer;
  transition:border-color .1s,box-shadow .1s;}
.yr-card:hover{border-color:var(--primary-mid)}
.yr-card.yr-cur{border-color:var(--primary-mid);box-shadow:0 0 0 2px var(--primary-lt)}
.yr-card.yr-sel{border-color:var(--primary);background:var(--primary-lt)}
.yr-mname{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:5px;line-height:1}
.yr-mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:5px}
.yr-mc{aspect-ratio:1;border-radius:1px}
.yr-mc.ym-blank{background:transparent}
.yr-mc.ym-other{background:var(--bd);opacity:.3}
.yr-foot{padding:12px 10px 28px}

/* ─── ADMIN ──────────────────────────────────────────────────── */
.adm-tabs{display:flex;border-bottom:2px solid var(--bd);background:var(--surface);padding:0 12px}
.adm-tab{padding:10px 14px;font-size:12px;font-weight:600;color:var(--mu);
  border-bottom:2px solid transparent;margin-bottom:-2px;
  transition:color .12s,border-color .12s;}
.adm-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.adm-tab:hover{color:var(--ink)}
.adm-section{padding:12px}
.adm-card{background:var(--surface);border:1px solid var(--bd);
  border-radius:var(--r);margin-bottom:10px;overflow:hidden;}
.adm-card-hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--bd);}
.adm-card-title{font-size:13px;font-weight:700;color:var(--ink);flex:1}
.adm-prog-bar{height:5px;background:var(--bd);border-radius:3px;overflow:hidden;margin:0 14px 12px}
.adm-prog-fill{height:100%;border-radius:3px;transition:width .4s ease}
.adm-user-row{display:flex;align-items:center;gap:10px;padding:10px 14px}
.adm-user-row+.adm-user-row{border-top:1px solid var(--bd)}
.adm-user-info{flex:1;min-width:0}
.adm-user-name{font-size:13px;font-weight:600;color:var(--ink)}
.adm-user-email{font-size:10px;color:var(--mu);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-role-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;
  flex-shrink:0;white-space:nowrap;}
.adm-del-btn{width:26px;height:26px;border-radius:5px;
  background:var(--so-bg);border:1px solid var(--so-bd);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;color:var(--so);flex-shrink:0;
  transition:background .1s;}
.adm-del-btn:hover{background:var(--so);color:#fff}
.adm-form{padding:14px;display:flex;flex-direction:column;gap:10px}

function extrasFor(pk,m){
  const ym=ymOf(m===undefined?MONTH:m);
  return Object.entries(extraTasks)
    .filter(([,t])=>t.personKey===pk&&t.ym===ym)
    .map(([xid,t])=>({...t,id:'x-'+xid,xid,name:t.tipo,detail:t.detalle,extra:true}))
    .sort((a,b)=>a.from-b.from);
}

/* Personas con alguna tarea (base o extra) en el mes */
function activePeople(m){
  return Object.keys(P).filter(k=>tasksFor(k,m).length>0);
}

const SC={
  done:    {lbl:'Completado',    c:'var(--sd)',bg:'var(--sd-bg)',icon:'✓',ord:4},
  active:  {lbl:'Activo ahora', c:'var(--sa)',bg:'var(--sa-bg)',icon:'●',ord:1},
  overdue: {lbl:'Vencido',      c:'var(--so)',bg:'var(--so-bg)',icon:'!',ord:0},
  upcoming:{lbl:'Próximo',      c:'var(--su)',bg:'var(--su-bg)',icon:'◷',ord:2},
  future:  {lbl:'Pendiente',    c:'var(--sf)',bg:'var(--sf-bg)',icon:'○',ord:3},
};

function getStatus(t){
  if(prog[t.id])             return 'done';
  if(t.to<DAY)               return 'overdue';
  if(t.from<=DAY&&t.to>=DAY)return 'active';
  if(t.from>DAY&&t.from<=DAY+4)return 'upcoming';
  return 'future';
}

// Can this user mark tasks for a given personKey?
function canMark(personKey){
  if(!ucfg) return false;
  if(ucfg.role==='admin') return true;
  if(ucfg.role==='viewer') return false;
  return ucfg.personKey===personKey;
}
// Cualquier usuario autenticado puede REGISTRAR tareas nuevas
function canCreate(){ return !!ucfg; }
// SOLO el administrador (Cristian Bernal) puede EDITAR o ELIMINAR tareas
function canEditTasks(){ return !!ucfg && ucfg.role==='admin'; }

function roleBadgeHTML(role){
  const map={
    admin: {bg:'var(--primary-lt)',c:'var(--primary)',lbl:'Admin'},
    member:{bg:'var(--sa-bg)',     c:'var(--sa)',     lbl:'Miembro'},
    viewer:{bg:'var(--sf-bg)',     c:'var(--sf)',     lbl:'Solo lectura'},
  };
  const s=map[role]||{bg:'var(--bg)',c:'var(--mu)',lbl:role};
  return `<span class="adm-role-badge" style="background:${s.bg};color:${s.c}">${s.lbl}</span>`;
}

/* ─── FIRESTORE ─────────────────────────────────────────────────── */
// Devuelve {exists:bool, cfg:objeto|null} para distinguir
// "no hay configuración todavía" de "este usuario no está habilitado"
async function loadUserConfig(email){
  const snap=await db.doc('config/roles').get();
  if(!snap.exists) return {exists:false,cfg:null};
  const d=snap.data();
  return {exists:true, cfg:d[email]||null};
}
async function seedRoles(){
  await db.doc('config/roles').set(SEED_ROLES);
}
async function loadAllRoles(){
  const snap=await db.doc('config/roles').get();
  return snap.exists?snap.data():{};
}
function subscribeProgress(){
  if(unsubProg) unsubProg();
  unsubProg=db.doc('progress/'+progDoc()).onSnapshot(snap=>{
    prog=snap.exists?snap.data():{};
    if(screen==='dashboard'||screen==='team'||screen==='landing'||
       screen==='calendar'||screen==='year'||screen==='admin') {
      render();
    }
  });
}
async function toggleTask(taskId){
  if(!cu) return;
  const ref=db.doc('progress/'+progDoc());
  if(prog[taskId]){
    await ref.set({[taskId]:firebase.firestore.FieldValue.delete()},{merge:true});
  } else {
    await ref.set({[taskId]:true},{merge:true});
  }
}
async function saveAllRoles(roles){
  await db.doc('config/roles').set(roles);
  allRoles=roles;
}

/* ─── TAREAS ADICIONALES ────────────────────────────────────────── */
function subscribeExtras(){
  if(unsubExtra) unsubExtra();
  unsubExtra=db.collection('extraTasks').onSnapshot(snap=>{
    const o={};
    snap.forEach(d=>{o[d.id]=d.data();});
    extraTasks=o;
    if(screen!=='login'&&screen!=='loading'&&screen!=='error') render();
  });
}
async function createExtra(data){
  await db.collection('extraTasks').add({
    ...data,
    createdBy:cu.email,
    createdByName:ucfg.name,
    createdAt:firebase.firestore.FieldValue.serverTimestamp(),
  });
}
async function updateExtra(xid,data){
  await db.doc('extraTasks/'+xid).update({
    ...data,
    updatedBy:cu.email,
    updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
  });
}
async function deleteExtra(xid){
  await db.doc('extraTasks/'+xid).delete();
  await db.doc('progress/'+progDoc())
    .set({['x-'+xid]:firebase.firestore.FieldValue.delete()},{merge:true});
}

/* ─── AUTH ──────────────────────────────────────────────────────── */
async function doLogin(email,password){
  return auth.signInWithEmailAndPassword(email.trim().toLowerCase(),password);
}
// ¿Este correo está en la lista autorizada del equipo?
function estaAutorizado(email){
  return Object.prototype.hasOwnProperty.call(SEED_ROLES, String(email||'').trim().toLowerCase());
}
// Primera vez: la persona define su propia contraseña.
// Solo funciona con los correos de la lista autorizada.
async function doRegister(email,password){
  const e=String(email||'').trim().toLowerCase();
  if(!estaAutorizado(e)){
    const err=new Error('no autorizado'); err.code='ies/no-autorizado'; throw err;
  }
  return auth.createUserWithEmailAndPassword(e,password);
}
async function doLogout(){
  if(unsubProg){unsubProg();unsubProg=null;}
  if(unsubExtra){unsubExtra();unsubExtra=null;}
  cu=null;ucfg=null;allRoles={};prog={};extraTasks={};
  await auth.signOut();
}

    .sort((a,b)=>SC[a.st].ord-SC[b.st].ord);
  const active=withSt.filter(t=>t.st==='active').length;
  const over=withSt.filter(t=>t.st==='overdue').length;

  const groups=['overdue','active','upcoming','future','done']
    .map(s=>({s,items:withSt.filter(t=>t.st===s)})).filter(g=>g.items.length);

  const taskHTML=groups.map(g=>{
    const cfg=SC[g.s];
    const items=g.items.map(t=>{

          </div>

        </div>
        <div class="t-det${isExp?' open':''}" id="det-${esc(t.id)}">${esc(t.detail)}</div>

/* ─── CALENDARIO ─────────────────────────────────────────────────── */
function getDins(m){return new Date(YEAR,m+1,0).getDate();}
function personsOnDay(d,vD,m){
  if(d<1||d>vD) return [];
  return Object.keys(P).filter(k=>tasksFor(k,m).some(t=>t.from<=d&&t.to>=d));
}
function tasksOnDay(d,vD,m){
  if(d<1||d>vD) return [];
  const r=[];
  Object.keys(P).forEach(k=>{
    tasksFor(k,m).filter(t=>t.from<=d&&t.to>=d).forEach(t=>r.push({...t,pk:k}));
  });
  return r;
}
function buildCells(m){
  const vD=getDins(m);
  const firstDow=new Date(YEAR,m,1).getDay();
  const off=(firstDow+6)%7;
  const cells=[];
  for(let i=0;i<off;i++) cells.push(null);
  for(let d=1;d<=vD;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);
  return {cells,vD};
}

function renderCalendar(){
  const isAdmin=ucfg&&ucfg.role==='admin';
  const DN=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const {cells,vD}=buildCells(viewMonth);
  const isCM=(viewMonth===MONTH);

  const gridHTML=cells.map(d=>{
    if(d===null) return `<div class="cal-cell other-month"></div>`;
    const isToday=isCM&&d===DAY, isSel=d===calDay;
    const persons=personsOnDay(d,vD,viewMonth);
    const dots=persons.map(pk=>`<div class="cal-dot" style="background:${P[pk].c}"></div>`).join('');
    const cls=['cal-cell',isToday?'today':'',isSel?'selected':''].filter(Boolean).join(' ');
    const nc=['cal-num',isToday?'today-n':(isSel?'sel-n':'')].filter(Boolean).join(' ');
    return `<div class="${cls}" data-action="calday" data-day="${d}">
      <div class="${nc}">${d}</div>
      <div class="cal-dots">${dots}</div>
    </div>`;
  }).join('');

  let detHTML='';
  if(calDay!==null){
    const dayTasks=tasksOnDay(calDay,vD,viewMonth);
    const hdr=`<div class="cal-panel-hdr">
      Día ${calDay} de ${MF[viewMonth]}
      <span class="cal-panel-count">${dayTasks.length} tarea${dayTasks.length!==1?'s':''}</span>
    </div>`;
    if(dayTasks.length===0){
      detHTML=`<div class="cal-panel"><div class="cal-panel-card">${hdr}<div class="cal-empty">Sin tareas programadas para este día</div></div></div>`;
    } else {
      const rows=dayTasks.map(t=>{
        const p=P[t.pk],isDone=isCM&&!!prog[t.id];
        return `<div class="cal-trow">
          <div class="cal-tav" style="background:${p.c}">${p.init}</div>
          <div class="cal-tinfo">
            <div class="cal-tname${isDone?' done':''}">${esc(t.name)}${t.extra?' <span class="x-tag">ADIC.</span>':''}</div>
            <div class="cal-tperson">${esc(p.name)} · Días ${t.from}–${t.to}</div>
          </div>
          ${t.doc?`<div class="cal-tdoc">${esc(t.doc)}</div>`:''}
        </div>`;
      }).join('');
      detHTML=`<div class="cal-panel"><div class="cal-panel-card">${hdr}${rows}</div></div>`;
    }
  }

  const prevM=(viewMonth+11)%12, nextM=(viewMonth+1)%12;
  const legend=activePeople(viewMonth)
    .map(k=>`<div class="cal-leg-item"><div class="cal-leg-dot" style="background:${P[k].c}"></div>${P[k].name.split(' ')[0]}</div>`)
    .join('');
  const dnHdr=DN.map(n=>`<div class="cal-dn">${n}</div>`).join('');

  return `
  ${appHeader({title:`Calendario · ${MF[viewMonth]}`,sub:YEAR+'',showAdmin:isAdmin})}
  <div class="cal-dnames">${dnHdr}</div>
  <div class="cal-nav">
    <button class="cal-nav-btn" data-action="calmonth" data-m="${prevM}">‹</button>
    <span class="cal-nav-label">${MF[viewMonth]} ${YEAR}</span>
    <button class="cal-nav-btn" data-action="calmonth" data-m="${nextM}">›</button>
  </div>
  <div class="cal-grid">${gridHTML}</div>
  <div class="cal-legend">${legend}</div>
  ${detHTML}
  <div class="cal-foot">
    <button class="ghost-btn" data-action="back">← Volver al inicio</button>
  </div>`;
}

/* ─── VISTA AÑO ──────────────────────────────────────────────────── */
function renderYear(){
  const isAdmin=ucfg&&ucfg.role==='admin';
  const cards=MF.map((mName,mi)=>{
    const {cells,vD}=buildCells(mi);
    const mini=cells.map(d=>{
      if(d===null) return `<div class="yr-mc ym-blank"></div>`;
      const ps=personsOnDay(d,vD,mi);
      if(!ps.length) return `<div class="yr-mc ym-other"></div>`;
      return `<div class="yr-mc" style="background:${P[ps[0]].c};opacity:.85"></div>`;
    }).join('');
    const isCur=mi===MONTH, isSel=mi===viewMonth;
    const cls=['yr-card',isCur?'yr-cur':'',isSel?'yr-sel':''].filter(Boolean).join(' ');
    return `<div class="${cls}" data-action="yearmonth" data-mi="${mi}">
      <div class="yr-mname">${mName}</div>
      <div class="yr-mini-grid">${mini}</div>
    </div>`;
  }).join('');

  const legend=activePeople()
    .map(k=>`<div class="cal-leg-item"><div class="cal-leg-dot" style="background:${P[k].c}"></div>${P[k].name.split(' ')[0]}</div>`)
    .join('');

  return `
  ${appHeader({title:`Año ${YEAR} · Vista completa`,sub:'Toca un mes para ver en detalle',showAdmin:isAdmin})}
  <div class="yr-grid">${cards}</div>
  <div class="cal-legend" style="padding:8px 10px 10px">${legend}</div>
  <div class="yr-foot"><button class="ghost-btn" data-action="back">← Volver al inicio</button></div>`;
}

  let body='';

  if(adminTab==='progress'){
    const cards=activePeople()
      .map(k=>{
        const p=P[k];
        const tasks=tasksFor(k);
        const done=tasks.filter(t=>!!prog[t.id]).length;
        const pct=tasks.length?Math.round(done/tasks.length*100):0;
        const over=tasks.filter(t=>t.to<DAY&&!prog[t.id]).length;
        const active=tasks.filter(t=>t.from<=DAY&&t.to>=DAY&&!prog[t.id]).length;
        let chip='';
        if(over>0) chip=`<span class="p-chip" style="background:var(--so-bg);color:var(--so);border-color:var(--so-bd)">! ${over}</span>`;

            <div class="adm-card-title">${p.name}<br><span style="font-size:10px;color:var(--mu);font-weight:400">${p.role}</span></div>

          <div class="adm-prog-bar"><div class="adm-prog-fill" style="width:${pct}%;background:${p.c}"></div></div>

        <div class="p-av" style="background:${cfg.personKey&&P[cfg.personKey]?P[cfg.personKey].c:'var(--mu)'};width:34px;height:34px;border-radius:7px;font-size:11px;flex-shrink:0">

          <div class="adm-user-name">${esc(cfg.name)}</div>
          <div class="adm-user-email">${esc(email)}</div>
        </div>
        ${roleBadgeHTML(cfg.role)}
        ${email!==cu.email?`<button class="adm-del-btn" data-action="admdeluser" data-email="${esc(email)}" title="Eliminar usuario">✕</button>`:''}
      </div>`).join('');

    const personOptions=Object.entries(P)
      .map(([k,p])=>`<option value="${k}">${p.name}</option>`).join('');

    const msg=admMsg?`<div class="adm-msg${admMsgErr?' log-err':''}">${esc(admMsg)}</div>`:'';

    body=`<div class="adm-section">
      <div class="adm-card">
        <div class="adm-card-hdr"><div class="adm-card-title">Usuarios activos</div></div>
        ${userRows||'<div style="padding:14px;font-size:12px;color:var(--mu)">No hay usuarios configurados</div>'}
      </div>
      <div class="adm-card">
        <div class="adm-card-hdr"><div class="adm-card-title">Agregar usuario</div></div>
        <div class="adm-form">
          <div class="adm-warn">Primero crea la cuenta en Firebase Console (Authentication → Add user), luego agrégala aquí.</div>
          <input class="adm-input" id="adm-email" type="email" placeholder="correo@ejemplo.com">
          <input class="adm-input" id="adm-name"  type="text"  placeholder="Nombre completo">
          <select class="adm-select" id="adm-role">

          <select class="adm-select" id="adm-person">

  return `

}

/* ═══════════════════════════════════════════════════════════════════
   RENDER PRINCIPAL
═══════════════════════════════════════════════════════════════════ */
function render(){
  const app=document.getElementById('app');
  let html='';
  if(screen==='loading')   html=renderLoading();
  else if(screen==='login') html=renderLogin();
  else if(screen==='error') html=renderError();
  else if(screen==='landing')    html=renderLanding();
  else if(screen==='dashboard')  html=renderDashboard(curPerson);
  else if(screen==='team')       html=renderTeam();
  else if(screen==='calendar')   html=renderCalendar();
  else if(screen==='year')       html=renderYear();
  else if(screen==='admin')      html=renderAdmin();
  else if(screen==='newtask')    html=renderNewTask();
  else if(screen==='setup')      html=renderSetup();
  app.innerHTML=html;
  attachEvents();
}

/* ═══════════════════════════════════════════════════════════════════
   EVENTOS
═══════════════════════════════════════════════════════════════════ */
/* Los listeners delegados van sobre #app, que NUNCA se destruye.
   Por eso se registran una sola vez: si se registraran en cada render
   se acumularían y un clic dispararía la acción varias veces
   (marcar y desmarcar en el mismo clic). */
let delegadosListos=false;

function attachEvents(){
  const app=document.getElementById('app');

  /* ── Login y primera contraseña ── */
  const logBtn=document.getElementById('log-submit');
  const firstBtn=document.getElementById('log-first');
  if(logBtn){
    const campos=()=>({
      email:(document.getElementById('log-email')||{}).value||'',
      pass :(document.getElementById('log-pass') ||{}).value||'',
      err  : document.getElementById('log-err'),
    });
    const mostrar=(el,msg)=>{el.textContent=msg;el.style.display='block';};
    const reset=()=>{
      logBtn.disabled=false;logBtn.textContent='Entrar';
      if(firstBtn){firstBtn.disabled=false;firstBtn.textContent='Primera vez — crear mi contraseña';}
    };

    const doLog=async()=>{
      const {email,pass,err}=campos();
      logBtn.disabled=true;logBtn.textContent='Entrando…';
      try{
        await doLogin(email,pass);
      } catch(e){
        let msg='Correo o contraseña incorrectos.';
        if(e.code==='auth/user-not-found')
          msg = estaAutorizado(email)
            ? 'Todavía no tienes contraseña. Usa el botón de abajo para crearla.'
            : 'Este correo no está habilitado. Contacta al administrador.';
        if(e.code==='auth/too-many-requests') msg='Demasiados intentos. Espera un momento.';
        if(e.code==='auth/network-request-failed') msg='Sin conexión a internet.';
        mostrar(err,msg);reset();
      }
    };

    const doFirst=async()=>{
      const {email,pass,err}=campos();
      if(!email.trim()) return mostrar(err,'Escribe tu correo primero.');
      if(pass.length<6)  return mostrar(err,'La contraseña debe tener al menos 6 caracteres.');
      firstBtn.disabled=true;firstBtn.textContent='Creando…';
      try{
        await doRegister(email,pass);
      } catch(e){
        let msg='No se pudo crear la contraseña.';
        if(e.code==='ies/no-autorizado')          msg='Este correo no está en la lista del equipo. Contacta al administrador.';
        if(e.code==='auth/email-already-in-use')  msg='Ya tienes contraseña creada. Usa el botón Entrar.';
        if(e.code==='auth/weak-password')         msg='La contraseña es muy débil. Usa 6 caracteres o más.';
        if(e.code==='auth/invalid-email')         msg='El correo no tiene un formato válido.';
        if(e.code==='auth/network-request-failed')msg='Sin conexión a internet.';
        mostrar(err,msg);reset();
      }
    };

    logBtn.addEventListener('click',doLog);
    if(firstBtn) firstBtn.addEventListener('click',doFirst);
    document.getElementById('log-pass').addEventListener('keydown',e=>{if(e.key==='Enter') doLog();});
  }

  /* ── Admin: add user ── */
  const addBtn=document.getElementById('adm-add');
  if(addBtn){
    addBtn.addEventListener('click',async()=>{
      const email=(document.getElementById('adm-email')||{}).value?.trim()||'';
      const name =(document.getElementById('adm-name') ||{}).value?.trim()||'';
      const role =(document.getElementById('adm-role') ||{}).value||'viewer';
      const person=(document.getElementById('adm-person')||{}).value||null;
      if(!email||!name){admMsg='Completa el correo y el nombre.';admMsgErr=true;render();return;}
      addBtn.disabled=true;
      const updated={...allRoles,[email]:{name,role,personKey:person||null}};
      try{
        await saveAllRoles(updated);
        allRoles=updated;
        admMsg=`${name} agregado correctamente.`;admMsgErr=false;
      }catch(e){admMsg='Error al guardar. Revisa la conexión.';admMsgErr=true;}
      render();
    });
  }

  /* ── Nueva tarea / editar tarea ── */
  const ntBtn=document.getElementById('nt-save');
  if(ntBtn){
    ntBtn.addEventListener('click',async()=>{
      const val=id=>(document.getElementById(id)||{}).value||'';
      const personKey=val('nt-person');
      const tipo   =val('nt-tipo').trim();
      const detalle=val('nt-detalle').trim();
      const fecha  =val('nt-fecha');
      const inicio =val('nt-inicio');
      const fin    =val('nt-fin');
      const horasRaw=val('nt-horas').trim();
      const doc    =val('nt-doc').trim().toUpperCase();

      const fail=m=>{ntMsg=m;ntMsgErr=true;render();};
      if(!tipo)          return fail('Escribe el tipo de tarea.');
      if(!detalle)       return fail('Agrega el detalle de la tarea.');
      if(!inicio||!fin)  return fail('Indica el inicio y el fin estimados.');
      if(fin<inicio)     return fail('El fin estimado no puede ser anterior al inicio.');

      const ym=inicio.slice(0,7);
      const from=parseInt(inicio.slice(8,10),10);
      const lastDay=new Date(+inicio.slice(0,4),+inicio.slice(5,7),0).getDate();
      const to=(fin.slice(0,7)===ym)?parseInt(fin.slice(8,10),10):lastDay;
      const horas=horasRaw===''?null:Number(horasRaw);

      const payload={personKey,tipo,detalle,fecha:fecha||TODAY_ISO,
                     inicio,fin,horas,doc,ym,from,to};

      ntBtn.disabled=true;
      ntBtn.textContent=ntEditing?'Guardando…':'Registrando…';
      try{
        if(ntEditing) await updateExtra(ntEditing,payload);
        else          await createExtra(payload);
        ntEditing=null;ntTarget=null;ntMsg='';ntMsgErr=false;
        curPerson=personKey;screen='dashboard';expanded.clear();
        render();
      }catch(err){
        console.error(err);
        ntMsg='No se pudo guardar. Revisa la conexión e intenta de nuevo.';
        ntMsgErr=true;render();
      }
    });
  }

  /* ── Configuración inicial ── */
  const setupBtn=document.getElementById('setup-go');
  if(setupBtn){
    setupBtn.addEventListener('click',async()=>{
      setupBtn.disabled=true;setupBtn.textContent='Creando…';
      try{
        await seedRoles();
        setupMsg='';setupErr=false;
        await bootUser(cu);          // vuelve a cargar con la config ya creada
      }catch(err){
        console.error(err);
        setupErr=true;
        setupMsg = err && err.code==='permission-denied'
          ? 'Firestore rechazó la escritura. Revisa que las reglas de seguridad estén publicadas y que el correo del administrador coincida.'
          : 'No se pudo crear la configuración. Revisa la conexión e intenta de nuevo.';
        render();
      }
    });
  }

  /* ── Delegados: solo la primera vez ── */
  if(delegadosListos) return;
  delegadosListos=true;

  /* ── Clicks delegados ── */
  app.addEventListener('click',async e=>{
    const expBtn=e.target.closest('[data-action="expand"]');
    if(expBtn){
      const id=expBtn.dataset.tid;
      const det=document.getElementById('det-'+id);
      if(!det) return;
      const open=det.classList.toggle('open');
      expBtn.textContent=open?'▲':'▼';
      open?expanded.add(id):expanded.delete(id);
      return;
    }

    const btn=e.target.closest('[data-action]');
    if(!btn) return;
    const {action,key,tab,m,day,mi,email,xid}=btn.dataset;

    if(action==='logout'){await doLogout();screen='login';render();return;}
    if(action==='back'){
      if(screen==='newtask'){
        const back=ntEditing?extraTasks[ntEditing]?.personKey:ntTarget;
        ntEditing=null;ntTarget=null;ntMsg='';ntMsgErr=false;
        if(back){curPerson=back;screen='dashboard';} else screen='landing';
      } else screen='landing';
      render();return;
    }
    if(action==='person')    {curPerson=key;screen='dashboard';expanded.clear();render();return;}
    if(action==='team')      {screen='team';render();return;}
    if(action==='calendar')  {screen='calendar';viewMonth=MONTH;calDay=DAY;render();return;}
    if(action==='calmonth')  {viewMonth=parseInt(m,10);calDay=viewMonth===MONTH?DAY:1;render();return;}
    if(action==='calday')    {calDay=parseInt(day,10);render();return;}
    if(action==='year')      {screen='year';render();return;}
    if(action==='yearmonth') {viewMonth=parseInt(mi,10);calDay=viewMonth===MONTH?DAY:1;screen='calendar';render();return;}
    if(action==='admin')     {adminTab='progress';admMsg='';screen='admin';render();return;}
    if(action==='admtab')    {adminTab=tab;admMsg='';render();return;}
    if(action==='export')    {doExport(key||curPerson);return;}
    if(action==='revert')    {await toggleTask(btn.dataset.tid);return;}
    if(action==='newtask'){
      if(!canCreate()) return;
      ntEditing=null;ntTarget=key||curPerson||ucfg.personKey||null;
      ntMsg='';ntMsgErr=false;screen='newtask';render();return;
    }
    if(action==='xedit'){
      if(!canEditTasks()) return;
      ntEditing=xid;ntTarget=null;ntMsg='';ntMsgErr=false;
      screen='newtask';render();return;
    }
    if(action==='xdel'){
      if(!canEditTasks()) return;
      const t=extraTasks[xid];
      if(!confirm(`¿Eliminar la tarea "${t?t.tipo:''}"?\n\nEsta acción no se puede deshacer.`)) return;
      try{ await deleteExtra(xid); }
      catch(err){ console.error(err); alert('No se pudo eliminar. Revisa la conexión.'); }
      return;
    }
    if(action==='admdeluser'){
      if(!confirm(`¿Eliminar el acceso de ${email}?`)) return;
      const updated={...allRoles};delete updated[email];
      await saveAllRoles(updated);
      render();
    }
  });

  /* ── Checkboxes ── */
  app.addEventListener('change',async e=>{
    const cb=e.target.closest('input[type=checkbox][data-tid]');
    if(!cb||cb.disabled) return;
    await toggleTask(cb.dataset.tid);
  });
}

/* ─── EXPORTAR ──────────────────────────────────────────────────── */
async function doExport(key){
  const p=P[key],tasks=tasksFor(key);
  const done=tasks.filter(t=>prog[t.id]).length;
  const lines=[
    `IES — Estado de Progreso`,`${'─'.repeat(40)}`,
    `${p.name} · ${p.role}`,
    `${DE[NOW.getDay()]}, ${DAY} de ${MF[MONTH]} ${YEAR}`,
    `Progreso: ${done} / ${tasks.length} tareas (${tasks.length?Math.round(done/tasks.length*100):0}%)`,
    ``,`TAREAS DEL MES:`,
    ...tasks.map(t=>{
      const st=getStatus(t);
      const m={done:'[✓]',active:'[●]',overdue:'[!]',upcoming:'[◷]',future:'[ ]'}[st];
      const x=t.extra?' (adicional'+(t.horas?` · ≈${t.horas}h`:'')+')':'';
      return `${m}  Días ${String(t.from).padStart(2,'0')}–${String(t.to).padEnd(2,' ')}  ${t.name}${x}`;
    }),
    ``,`Generado el ${NOW.toLocaleString('es-CO')}`,
  ];
  const txt=lines.join('\n');
  try{
    await navigator.clipboard.writeText(txt);
    const btn=document.querySelector('[data-action="export"]');
    if(btn){const o=btn.innerHTML;btn.innerHTML='✓ Copiado';setTimeout(()=>btn.innerHTML=o,2400);}
  }catch{}
}

/* ═══════════════════════════════════════════════════════════════════
   INICIALIZACIÓN — escucha cambios de autenticación
═══════════════════════════════════════════════════════════════════ */
render(); // muestra loading

async function bootUser(user){
  try{
    screen='loading';render();
    const res=await loadUserConfig(user.email);

    // Primera vez: todavía no existe config/roles
    if(!res.exists){ screen='setup'; render(); return; }

    // Existe la configuración pero este usuario no está habilitado
    if(!res.cfg){ screen='error'; render(); return; }

    ucfg=res.cfg;
    if(ucfg.role==='admin') allRoles=await loadAllRoles();
    subscribeProgress();
    subscribeExtras();
    screen=ucfg.role==='viewer'?'team':'landing';
    render();
  }catch(err){
    console.error(err);
    screen='error';render();
  }
}

auth.onAuthStateChanged(async user=>{
  cu=user;
  if(!user){
    ucfg=null;allRoles={};prog={};extraTasks={};
    setupMsg='';setupErr=false;
    if(unsubProg){unsubProg();unsubProg=null;}
    if(unsubExtra){unsubExtra();unsubExtra=null;}
    screen='login';render();
    return;
  }
  await bootUser(user);
});
